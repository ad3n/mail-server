version: '3'

tasks:
  build:
    desc: Build the Stalwart server and admin WebUI bundle
    deps: [build:server, build:ui]

  build:server:
    desc: Build the local Stalwart binary with Cargo
    cmds:
      - cargo +"${STALWART_TOOLCHAIN:-1.98.0}" build --locked -p stalwart --no-default-features --features "${STALWART_FEATURES:-sqlite,postgres}"

  build:ui:
    desc: Build the admin WebUI bundle with the local integration apps
    cmds:
      - |
        set -eu
        revision=4414cd585b0cae9d271487ff5619631d9c752b04
        local_dir="$PWD/.stalwart-local"
        mkdir -p "$local_dir"
        build_dir=$(mktemp -d "$local_dir/webui-build.XXXXXXXX")
        trap 'rm -rf "$build_dir"' EXIT
        source_repo="$local_dir/webui-src"
        if ! git -C "$source_repo" cat-file -e "$revision^{commit}" 2>/dev/null; then
          source_repo="$build_dir/upstream"
          git init -q "$source_repo"
          git -C "$source_repo" fetch --depth=1 https://github.com/stalwartlabs/webui.git "$revision"
        fi
        git -C "$source_repo" archive --output="$build_dir/source.tar" "$revision"
        tar -xf "$build_dir/source.tar" -C "$build_dir"
        cp -R resources/webui/src/. "$build_dir/src/"
        (cd "$build_dir" && bash build.sh)
        mv "$build_dir/.ignore/webui.zip" "$local_dir/webui-integrations.zip"

  run:
    desc: Run Stalwart locally with Cargo
    cmds:
      - |
        set -eu
        export CONFIG_PATH="${CONFIG_PATH:-$PWD/.stalwart-local/config.json}"
        mkdir -p "$(dirname "$CONFIG_PATH")"
        export STALWART_HOSTNAME="${STALWART_HOSTNAME:-localhost}"
        export STALWART_PUBLIC_URL="${STALWART_PUBLIC_URL:-http://localhost:8080}"
        if [ "$CONFIG_PATH" = "$PWD/.stalwart-local/config.json" ] && [ -z "${STALWART_RECOVERY_ADMIN+x}" ] && [ -s "$PWD/.stalwart-local/admin-password" ]; then
          export STALWART_RECOVERY_ADMIN="admin:$(cat "$PWD/.stalwart-local/admin-password")"
        fi
        exec cargo +"${STALWART_TOOLCHAIN:-1.98.0}" run --locked -p stalwart --no-default-features --features "${STALWART_FEATURES:-sqlite,postgres}"

  docker:build:
    desc: Build the local Stalwart Docker image
    cmds:
      - docker build --tag "${IMAGE:-stalwart:local}" .
