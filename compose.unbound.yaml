services:
  unbound:
    build:
      context: ./docker/unbound
    restart: unless-stopped
    volumes:
      - unbound-state:/var/lib/unbound
    networks:
      resolver:
        ipv4_address: 172.30.53.53
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 . DNSKEY +dnssec +time=3 +tries=1 | grep -q 'flags:.* ad;' "]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  stalwart:
    networks:
      default: {}
      resolver: {}

networks:
  resolver:
    ipam:
      config:
        - subnet: 172.30.53.0/24

volumes:
  unbound-state:
